# GERADO por scripts/gen-tests.js a partir de data/baseline_manifest.json — não editar à mão.
# Rode "npm run gen-tests" depois de recapturar o baseline.

- description: "PETR4 regression vs baseline 2026-08-08"
  vars:
    prompt: file://data/prompts/PETR4.txt
    ticker: PETR4
    baselineScoreGeral: 6.7
    baselineFundamentos: 7.5
    baselineValuation: 9
    baselineRegimeMomentum: 6
    baselineSentimentoInstitucional: 5.5
    baselineRetornoAcionista: 6
    baselineGestaoRisco: 6
  assert:
    - type: is-json
      value: file://asserts/schema.json
    - type: javascript
      value: file://asserts/score-drift.js
    - type: llm-rubric
      value: file://asserts/coherence-rubric.txt

