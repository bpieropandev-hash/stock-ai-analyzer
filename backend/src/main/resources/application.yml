spring:
  config:
    import: optional:file:../.env[.properties]

  application:
    name: stock-ai-analyzer-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:stockai}
    username: ${POSTGRES_USER:stockai_user}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Schema é gerido pelo Flyway (db/migration/) — validate só confere que as
      # entidades batem com o schema aplicado, nunca altera o banco.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    # Banco de dev já existia via ddl-auto=update antes do Flyway entrar — em vez de
    # recriar do zero, marca o schema atual como já estando na versão 1 (V1 é a
    # baseline exata desse schema). Ambiente novo/limpo roda V1 normalmente.
    baseline-on-migrate: true
    baseline-version: 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  task:
    scheduling:
      pool:
        # StockFetchJob (60s) e HistoricalIndexingJob (diário, demorado) não podem
        # disputar uma única thread — com pool 1, a indexação congela as cotações
        size: 2

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email,profile

app:
  cors:
    # Lista separada por vírgula — origens permitidas a chamar a API (credentials=true exige origem exata, não wildcard).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  frontend:
    # Destino do redirect pós-login OAuth2 (SecurityConfig/OAuth2SuccessHandler).
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}

pgvector:
  host: ${POSTGRES_HOST:localhost}
  port: ${POSTGRES_PORT:5432}
  database: ${POSTGRES_DB:stockai}

python:
  sidecar:
    enabled: ${PYTHON_SIDECAR_ENABLED:true}
    base-url: ${PYTHON_SIDECAR_URL:http://127.0.0.1:8001}
  script:
    path: ${PYTHON_SCRIPT_PATH:scripts/fetch_stock.py}
    fundamentals-path: ${PYTHON_FUNDAMENTALS_PATH:scripts/fetch_fundamentals.py}
    macro-path: ${PYTHON_MACRO_PATH:scripts/fetch_macro.py}
    historical-fundamentals-path: ${PYTHON_HISTORICAL_PATH:scripts/fetch_historical_fundamentals.py}
    news-path: ${PYTHON_NEWS_PATH:scripts/fetch_news.py}
    sentiment-path: ${PYTHON_SENTIMENT_PATH:scripts/analyze_sentiment.py}
    technical-indicators-path: ${PYTHON_TECHNICAL_PATH:scripts/fetch_technical_indicators.py}
    price-history-path: ${PYTHON_PRICE_HISTORY_PATH:scripts/fetch_price_history.py}
    sector-benchmarks-path: ${PYTHON_SECTOR_BENCHMARKS_PATH:scripts/fetch_sector_benchmarks.py}

huggingface:
  token: ${HUGGINGFACE_TOKEN:}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  timeout-minutes: 5
  embedding:
    model: nomic-embed-text
    dimension: 768

gemini:
  api-key: ${GEMINI_API_KEY:}

groq:
  api-key: ${GROQ_API_KEY:}

embedding:
  store:
    table: stock_embeddings

# Sem fallback — segredo de assinatura JWT previsível permitiria forjar tokens.
# Defina JWT_SECRET no .env (mínimo 32 caracteres aleatórios).
jwt:
  secret: ${JWT_SECRET}
